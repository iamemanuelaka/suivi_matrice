name: Suivi des activités PCR-CI

on:
  schedule:
    - cron: "0 7 * * 1"          # chaque lundi 07:00 UTC (= 07:00 à Abidjan)
  workflow_dispatch:             # lancement manuel depuis l'onglet Actions
    inputs:
      send_mail:
        description: "Envoyer les documents par e-mail"
        type: boolean
        default: false

permissions:
  contents: write                # pour enregistrer la base et les documents dans le dépôt (stockage persistant)

concurrency:                     # un seul traitement à la fois : évite les conflits sur la base
  group: suivi-pcr
  cancel-in-progress: false

jobs:
  suivi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Africa/Abidjan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Tests (un code cassé ne doit jamais écraser la base)
        id: tests
        run: python -m pytest -q tests

      - name: Cycle complet (Kobo -> base -> Word + Excel -> e-mail)
        env:
          KOBO_URL: ${{ vars.KOBO_URL || 'https://kf.kobotoolbox.org' }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.send_mail }}" = "true" ]; then MAIL="--mail"; else MAIL=""; fi
          python -m pcr kobo-sync --sans-redeploiement || echo "Liste Kobo non synchronisée (non bloquant)"
          python -m pcr lancer $MAIL --declencheur "${{ github.event_name }}" | tee resume.txt
          cat resume.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer la base et les documents dans le dépôt
        if: always()
        run: |
          git config user.name "pcr-suivi-bot" && git config user.email "pcr-suivi-bot@users.noreply.github.com"
          git add data sorties
          if git diff --cached --quiet; then echo "Aucun changement."; else
            git commit -m "Suivi actualisé automatiquement ($(date +%d/%m/%Y' '%H:%M))"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Alerte e-mail si le lundi n'a pas pu démarrer (tests en échec)
        if: failure() && github.event_name == 'schedule' && steps.tests.outcome == 'failure'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python -m pcr alerter --sujet "[ÉCHEC] Suivi PCR-CI du lundi : tests en échec" \
            --message "Le traitement hebdomadaire n'a pas démarré car les tests automatiques ont échoué. La base n'a pas été modifiée. Détail : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/upload-artifact@v4
        with:
          name: documents-actualises
          path: sorties/
          retention-days: 30
