name: Application Windows (installateur)

# Fabrique l'installateur PCR-CI-Installation-x.y.z.exe :
#  - à la demande (onglet Actions → « Run workflow ») : installateur téléchargeable dans les artefacts du run ;
#  - en poussant une étiquette v1.0.0, v1.1.0… : installateur publié dans « Releases » du dépôt.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Africa/Abidjan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt -r requirements-app.txt
      - name: Tests (moteur + application)
        run: python -m pytest -q tests

  windows:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      TZ: Africa/Abidjan
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt -r requirements-app.txt pyinstaller

      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Exécutable (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed --name PCR-CI --icon packaging/icone.ico
          --add-data "config;config" --add-data "modeles;modeles" --add-data "kobo;kobo"
          --add-data "pcr_app/icone.png;pcr_app"
          --collect-all nicegui --collect-all webview --collect-all pythonnet --collect-all clr_loader
          --collect-all pyxform --collect-all docx --collect-data openpyxl --collect-submodules pcr --collect-submodules pcr_app
          --exclude-module pkg_resources --paths .
          packaging/lancer_pcr_ci.py

      - name: Contrôle de démarrage de l'exécutable
        shell: pwsh
        run: |
          $env:PCR_NAVIGATEUR = "1"; $env:PCR_APP_HOME = "$env:RUNNER_TEMP\pcr_home"
          $p = Start-Process -FilePath "dist\PCR-CI\PCR-CI.exe" -PassThru
          Start-Sleep -Seconds 25
          try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/parametres" -UseBasicParsing -TimeoutSec 20; Write-Host "HTTP $($r.StatusCode)" }
          catch { Get-Content "$env:RUNNER_TEMP\pcr_home\PCR-CI\journal.log" -ErrorAction SilentlyContinue; throw }
          finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" packaging\pcr_ci.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: PCR-CI-Installation-${{ steps.v.outputs.version }}
          path: dist/PCR-CI-Installation-*.exe
          retention-days: 60

      - name: Publication dans Releases (étiquette v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PCR-CI-Installation-*.exe
          generate_release_notes: true
