name: Suivi PCR-CI

on:
  schedule:
    # Tous les lundis à 07:00 UTC (08:00 heure d'Abidjan)
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      declencheur:
        description: 'Origine du déclenchement'
        required: false
        default: 'manuel'

jobs:
  suivi:
    runs-on: ubuntu-latest
    env:
      TZ: Africa/Abidjan

    steps:
      # 1. Récupération du code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Installation de Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 3. Installation des dépendances (ÉTAPE CRITIQUE MANQUANTE)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Lancement des tests
      - name: Run tests
        run: python -m pytest -q tests

      # 5. Configuration git pour le commit automatique
      - name: Configure git
        run: |
          git config user.name "pcr-suivi-bot"
          git config user.email "pcr-suivi-bot@users.noreply.github.com"

      # 6. Exécution du pipeline complet (Kobo → base → Word + Excel → e-mail)
      - name: Run full pipeline
        env:
          KOBO_URL: ${{ secrets.KOBO_URL }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          DECL="${{ github.event.inputs.declencheur || 'github-actions' }}"
          python -m pcr lancer --declencheur "$DECL" --mail

      # 7. Commit et push des fichiers générés
      - name: Commit and push outputs
        run: |
          DATE=$(date +'%d/%m/%Y %H:%M')
          git add -A
          # Commit uniquement s'il y a des changements
          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
          else
            git commit -m "Suivi actualisé automatiquement (${DATE})"
            git push
          fi
